# CloudBox Nginx Reverse Proxy Configuration

# Upstream definition for Express Backend container
upstream cloudbox_backend {
    server api:5000;
    keepalive 32;
}

# HTTP Server (Port 80)
# Proxies requests directly to Express Backend container
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum payload size for file uploads
    client_max_body_size 100M;

    # Let's Encrypt / Certbot ACME Webroot Verification Endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Backend API Proxy Configuration
    location / {
        proxy_pass http://cloudbox_backend;
        proxy_http_version 1.1;

        # WebSockets / HTTP Keep-Alive Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Forwarding Headers (Crucial for Express trust proxy & IP rate limiting)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
