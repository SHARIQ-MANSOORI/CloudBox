# CloudBox Nginx Reverse Proxy Configuration

# Upstream definition for Express Backend container
upstream cloudbox_backend {
    server api:5000;
    keepalive 32;
}

# HTTP Server (Port 80)
# Handles Certbot ACME challenge and redirects all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / Certbot ACME Webroot Verification Endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS (uncomment when SSL certificate is issued)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _; # Replace with domain name (e.g., api.yourdomain.com)

    # SSL Certificate Paths (Certbot default paths)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum payload size for file uploads
    client_max_body_size 100M;

    # Backend API Proxy Configuration
    location / {
        proxy_pass http://cloudbox_backend;
        proxy_http_version 1.1;

        # WebSockets / HTTP Keep-Alive Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Forwarding Headers (Crucial for Express trust proxy & IP rate limiting)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
